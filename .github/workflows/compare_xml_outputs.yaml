name: Compare XML outputs

on:
  # workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  compare-XML-outputs:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr_branch

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (optional)
        run: |
          pip install -r pr_branch/tests/pip_requirements.txt || true

      - name: Run tests in base branch
        run: |
          cd base_branch/tests
          ./generate_xml_files.sh

      - name: Run tests in PR branch
        run: |
          cd pr_branch/tests
          ./generate_xml_files.sh

      - name: Compare XML outputs
        id: diff
        run: |
          mkdir -p diff_output
          has_diff=0
          for file in $(find base_branch/tests/xml -name "*.xml"); do
            rel_path=${file#base_branch/}
            pr_file="pr_branch/$rel_path"
            diff_output_file="diff_output/$(basename $file).diff"
            if [ -f "$pr_file" ]; then
              diff -u -I "ENTITY HOMErrfs" "$file" "$pr_file" > "$diff_output_file" || true
              if [ -s "$diff_output_file" ]; then
                has_diff=1
              else
                rm -f "$diff_output_file"
              fi
            else
              echo "Missing in PR: $rel_path" >> diff_output/missing_files.diff
              has_diff=1
            fi
          done
          echo "has_diff=$has_diff" >> $GITHUB_OUTPUT

      - name: Echo diffs
        if: steps.diff.outputs.has_diff == '1'
        run: |
          echo "===== DIFFS FOUND ====="
          cat diff_output/*.diff || true
          echo "======================="

      - name: Upload diff artifact
        if: steps.diff.outputs.has_diff == '1'
        uses: actions/upload-artifact@v4
        with:
          name: xml-diffs
          path: diff_output/

      - name: Check override
        id: check_override
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          override_found=0
          comments=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments")
          override_found=$(echo "$comments" | jq '[.[] | select(.user.login=="guoqing-noaa" or .user.login=="MatthewPyle-NOAA") | .body] | map(select(test("compare-XML-outputs=ignore"))) | length')
          if [ "$override_found" -gt 0 ]; then
            echo "'compare-XML-outputs=ignore' found, allow override"
          fi
          echo "override=$override_found" >> $GITHUB_OUTPUT

      - name: fail if diffs exist
        if: steps.diff.outputs.has_diff == '1'
        run: |
          if [ "${{ steps.check_override.outputs.override }}" = "1" ]; then
            echo "Override detected: ignoring XML diffs."
            exit 0
          fi
          echo "!!! XML outputs have changed in the PR branch !!!"
          echo "Check the differences in the 'Echo diffs' section,"
          echo "Or download the zip file from the "Upload diff artifact" section to inspect them locally."
          exit 1
