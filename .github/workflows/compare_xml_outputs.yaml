name: Compare XML outputs

on:
  pull_request:
  # workflow_dispatch:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  compare-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr_branch

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base_branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (optional)
        run: |
          pip install -r pr_branch/tests/pip_requirements.txt || true

      - name: Run tests in base branch
        run: |
          cd base_branch/tests
          ./generate_xml_files.sh

      - name: Run tests in PR branch
        run: |
          cd pr_branch/tests
          ./generate_xml_files.sh

      - name: Compare XML outputs
        id: diff
        run: |
          mkdir diff_output

          has_diff=0

          for file in $(find base_branch/tests/xml -name "*.xml"); do
            rel_path=${file#base_branch/}
            pr_file="pr_branch/$rel_path"

            if [ -f "$pr_file" ]; then
	      diff -u -I "ENTITY HOMErrfs" "$file" "$pr_file" > "diff_output/$(basename $file).diff" || true
	      if [ -s "diff_output/$(basename $file).diff" ]; then
		has_diff=1
	      else
		rm -f "diff_output/$(basename $file).diff"
	      fi
            else
              echo "Missing in PR: $rel_path" >> diff_output/missing_files.diff
              has_diff=1
            fi
          done

          echo "has_diff=$has_diff" >> $GITHUB_OUTPUT

      - name: Upload diff artifact
        if: steps.diff.outputs.has_diff == '1'
        uses: actions/upload-artifact@v4
        with:
          name: xml-diffs
          path: diff_output/
